spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/mtm
    username: mtm
    password: mtm
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  ai:
    model:
      chat: none
      embedding: ollama
    ollama:
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

mtm:
  knowledge:
    corpus-location: classpath:knowledge/
    top-k: 3
    similarity-threshold: 0.5
    index-on-startup: true
